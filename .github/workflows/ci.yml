name: CI
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Lua and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Syntax and behavior
        run: |
          luac5.1 -p 500miles.lua tests/test.lua
          lua5.1 tests/test.lua
      - name: Verify current client targets and Blizzard APIs
        run: python3 tests/check-wow-targets.py
      - name: Validate and build installable addon
        run: |
          python3 -m json.tool renovate.json > /dev/null
          python3 tests/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 500miles-addon
          path: dist/*
          if-no-files-found: error
